# Build the pkgdown documentation site (served at the root) and the client-side
# web app (served at /app), then publish both to the gh-pages branch. The
# gh-pages branch therefore contains only rendered output -- no R or web source.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: deploy-pages.yaml

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build pkgdown site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE, dest_dir = "_site")
        shell: Rscript {0}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build web app
        run: |
          if [ -d webapp ]; then
            cd webapp
            npm ci
            npm run build
            mkdir -p ../_site/app
            cp -r dist/. ../_site/app/
          else
            echo "No webapp/ directory; skipping web app build."
          fi

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
