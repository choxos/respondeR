# Typecheck, test (engine + R parity) and build the browser web app.
on:
  push:
    branches: [main, master]
    paths: ["webapp/**", ".github/workflows/webapp-ci.yaml"]
  pull_request:
    branches: [main, master, "release/**"]
    paths: ["webapp/**", ".github/workflows/webapp-ci.yaml"]

name: webapp-ci.yaml

permissions: read-all

jobs:
  webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
